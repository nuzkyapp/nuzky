name: nuzky-account

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  account:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nuzky-account
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["3000"]

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *logging
    depends_on: [account]
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  litestream:
    image: litestream/litestream:0.5.18
    restart: unless-stopped
    logging: *logging
    depends_on: [account]
    user: "1000:1000"
    command: ["replicate", "-config", "/etc/litestream.yml"]
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT}
      LITESTREAM_REGION: ${LITESTREAM_REGION}
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

volumes:
  data:
  caddy-data:
  caddy-config:
