name: Build and test

# The macOS build runs on every push to main; all three systems build installers for release tags
# (through release.yml) and on request. checks.yml runs Linux checks; scripts/check.sh adds the local gate.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["macos-14"]') || fromJSON('["ubuntu-24.04", "macos-14", "windows-2022"]') }}
        # One after the other, clippy, the tests and the installers took 71 minutes on Windows, 33 on macOS and 27 on
        # Linux. On machines of their own a release waits only for the longest of them.
        part: [clippy, test, installers]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable
      # The root Cargo.toml with the build profiles is not in rust-cache's own key, and its version line stays out of
      # ours, or a release tag never finds main's cache (checks.yml).
      - name: Build profiles
        id: profiles
        shell: bash
        run: echo "hash=$(grep -v '^version = ' Cargo.toml | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      # Only main saves, so pull requests and tags, which can read main's caches, never push them out of the
      # repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.part }}-ffmpeg-v1-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/setup-ubuntu-deps.sh
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install ffmpeg ffmpeg-full pkg-config cmake
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-deps.ps1
      - run: npm ci
      - name: ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs
      - run: npm run typecheck
        if: matrix.part == 'clippy'
      - run: cargo fmt --all --check
        if: matrix.part == 'clippy'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: matrix.part == 'clippy'
      - run: cargo test --workspace --locked --no-fail-fast
        if: runner.os != 'macOS' && matrix.part == 'test'
      # The engine tests draw frame numbers with drawtext, which only Homebrew's keg-only ffmpeg-full has.
      # Nuzky itself builds against ffmpeg.
      - name: cargo test --workspace --locked --no-fail-fast
        if: runner.os == 'macOS' && matrix.part == 'test'
        run: PATH="$(brew --prefix ffmpeg-full)/bin:$PATH" cargo test --workspace --locked --no-fail-fast
      - name: Build installers
        if: matrix.part == 'installers'
        run: node scripts/build-bundles.mjs
      - name: Verify Linux bundle
        if: runner.os == 'Linux' && matrix.part == 'installers'
        run: bash scripts/verify-linux-bundle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.part == 'installers'
        with:
          name: nuzky-${{ matrix.os }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/build-info-*.txt
          if-no-files-found: error
          retention-days: 14
  # A fresh machine: the build job ran every dependency's build code, which could have left a process or a changed
  # PATH or script behind to read the secrets of a later step.
  sign-macos:
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuzky-macos-14
          path: target/release/bundle
      - name: Sign and notarize the macOS installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: node scripts/sign-macos.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuzky-macos-14
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/build-info-darwin.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true
