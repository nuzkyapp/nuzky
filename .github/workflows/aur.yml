name: Update the AUR package

# Arch Linux and Omarchy install Nuzky from the AUR as nuzky-bin, which repackages the release's AppImage
# (packaging/aur/nuzky-bin/PKGBUILD). Each published release puts its version and checksum there. Run workflow does
# the same for a published tag, for example after a fix of the PKGBUILD with a higher pkgrel.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: A published release, for example v0.1.8-alpha
        required: true

permissions:
  contents: read

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  build:
    # The third-party source pre-release has a tag of its own and no AppImage.
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: archlinux:base-devel@sha256:2de80105abb49f813a85393c6758a4334deb6bcec4a2411bd2f059c0bee6ee4c
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Build nuzky-bin from the release's AppImage
        run: |
          set -euo pipefail
          if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a version tag"
            exit 1
          fi
          pacman -Syu --noconfirm --needed pacman-contrib
          useradd -m builder
          cd /home/builder
          curl -fsSL --proto '=https' -o PKGBUILD \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/packaging/aur/nuzky-bin/PKGBUILD"
          sed -i "s/^_tag=.*/_tag=${TAG#v}/" PKGBUILD
          # A new release starts its package at 1; a run by hand keeps the pkgrel of the PKGBUILD it fixes.
          if [ "$EVENT" = release ]; then sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD; fi
          chown -R builder: .
          # The container has none of the libraries the installed app needs, and repackaging needs none of them.
          su builder -c 'updpkgsums && makepkg --noconfirm --nodeps && makepkg --printsrcinfo > .SRCINFO'
          bsdtar -tvf nuzky-bin-*.pkg.tar.zst > contents.txt
          # The AppImage keeps its folders at 0700, which would let only root start Nuzky.
          if awk '$1 ~ /^d/ && $1 != "drwxr-xr-x"' contents.txt | grep .; then
            echo "::error::These folders are not readable by everyone"
            exit 1
          fi
          for file in usr/bin/nuzky-app opt/nuzky/AppRun opt/nuzky/usr/bin/nuzky-app opt/nuzky/usr/lib/Nuzky/libonnxruntime.so.1 \
            usr/share/applications/nuzky-app.desktop; do
            grep -q " $file\$" contents.txt || { echo "::error::$file is missing from the package"; exit 1; }
          done
          mkdir -p "$GITHUB_WORKSPACE/aur"
          cp PKGBUILD .SRCINFO "$GITHUB_WORKSPACE/aur/"
          cat .SRCINFO
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: aur/
          include-hidden-files: true
          retention-days: 7

  # Only this job holds the AUR key, on a machine that ran no package or release code.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur
          path: aur
      - name: Push PKGBUILD and .SRCINFO to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::The AUR_SSH_PRIVATE_KEY secret is missing (docs/BUILDING.md, Arch Linux and Omarchy)"
            exit 1
          fi
          test "$(ls -A aur | sort | paste -sd ' ')" = '.SRCINFO PKGBUILD'
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # The key aur.archlinux.org publishes as SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/nuzky-bin.git package
          cp aur/PKGBUILD aur/.SRCINFO package/
          cd package
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR already has this PKGBUILD."
            exit 0
          fi
          git -c user.name='Tomáš Mach' -c user.email='52257177+tomasmach@users.noreply.github.com' \
            commit -m "Update to ${TAG#v}"
          git push origin HEAD:master
