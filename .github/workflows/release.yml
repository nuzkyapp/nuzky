name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Only the Tauri CLI is needed, to sign the update packages; no dependency's install script runs.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuzky-*
          path: artifacts
          merge-multiple: true
      - name: Attach installers to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node -e 'const v = require("./src-tauri/tauri.conf.json").version; if (process.env.RELEASE_TAG !== `v${v}`) throw new Error(`Tag must match app version v${v}`)'
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty; update packages must be signed."
            exit 1
          fi
          find artifacts -type f -exec cp {} . \;
          for file in ./*.AppImage ./*.deb ./*-setup.exe ./*.app.tar.gz; do
            node_modules/.bin/tauri signer sign --app-version "${RELEASE_TAG#v}" "$file"
          done
          # Installed copies read the version and signed update packages from the latest published release.
          node <<'NODE'
          const fs = require('fs');
          const { version } = require('./src-tauri/tauri.conf.json');
          const platforms = {};
          for (const [keys, suffix] of [
            [['darwin-aarch64-app', 'darwin-aarch64'], '.app.tar.gz'],
            [['windows-x86_64-nsis', 'windows-x86_64'], '-setup.exe'],
            [['linux-x86_64-appimage'], '.AppImage'],
            [['linux-x86_64-deb'], '.deb'],
          ]) {
            const file = fs.readdirSync('.').find(name => name.endsWith(suffix));
            const entry = {
              url: `https://github.com/${{ github.repository }}/releases/download/${process.env.RELEASE_TAG}/${file}`,
              signature: fs.readFileSync(`${file}.sig`, 'utf8'),
            };
            for (const key of keys) platforms[key] = entry;
          }
          fs.writeFileSync('latest.json', JSON.stringify({ version, pub_date: new Date().toISOString(), platforms }) + '\n');
          NODE
          # A notarized dmg opens without Open Anyway.
          if grep -Fxq 'macOS signature: Developer ID, notarized and stapled' build-info-darwin.txt; then
            sed '/^- \*\*macOS\*\*:/d' scripts/release-notes.md > release-notes.md
          else
            cp scripts/release-notes.md release-notes.md
          fi
          SOURCE_TAG="third-party-source-${RELEASE_TAG#v}"
          sed "s/VERSION/${RELEASE_TAG#v}/g" scripts/third-party-source-notes.md > third-party-source-notes.md
          for tag in "$RELEASE_TAG" "$SOURCE_TAG"; do
            if gh release view "$tag" >/dev/null 2>&1; then
              test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            fi
          done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A rerun can replace a notarized dmg with one that is not, or the other way round.
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Nuzky $RELEASE_TAG" --notes-file release-notes.md
          fi
          if gh release view "$SOURCE_TAG" >/dev/null 2>&1; then
            gh release edit "$SOURCE_TAG" --prerelease --notes-file third-party-source-notes.md
          else
            gh release create "$SOURCE_TAG" --target "$(git rev-parse "${RELEASE_TAG}^{commit}")" --draft --prerelease --title "Third-party source for Nuzky $RELEASE_TAG" --notes-file third-party-source-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.AppImage ./*.deb ./*.dmg ./*.app.tar.gz ./*-setup.exe latest.json --clobber
          gh release upload "$SOURCE_TAG" ./build-info-*.txt --clobber
  # After the drafts, so its gigabytes never hold them up. An archive whose build-info matches the last published
  # source release is that release's source again (docs/BUILDING.md, Redistribution).
  reuse-third-party-source:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nuzky-*
          path: artifacts
          merge-multiple: true
      - name: Copy unchanged third-party source archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SOURCE_TAG="third-party-source-${RELEASE_TAG#v}"
          test "$(gh release view "$SOURCE_TAG" --json isDraft --jq .isDraft)" = true
          previous=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -sr '[.[][] | select(.draft == false and (.tag_name | startswith("third-party-source-")))] | max_by(.published_at) | .tag_name // empty')
          mkdir -p previous transfer
          : > previous/assets
          if [ -n "$previous" ]; then
            gh release view "$previous" --json assets --jq '.assets[].name' > previous/assets
            gh release download "$previous" --pattern 'build-info-*.txt' --dir previous || true
          fi
          echo "Third-party source comparison: ${previous:-no published source release}." >> "$GITHUB_STEP_SUMMARY"
          onnx_match=true
          for platform in linux darwin win32; do
            for side in artifacts previous; do
              file=$(find "$side" -type f -name "build-info-$platform.txt" -print -quit)
              if [ -n "$file" ]; then
                sed '1{/^Nuzky .*, commit/d;}; /^rustc /d; /^macOS signature:/d' "$file" > "$side/$platform.normalized"
                grep '^ONNX Runtime ' "$file" > "$side/$platform.onnx" || onnx_match=false
              else
                : > "$side/$platform.normalized"
                onnx_match=false
              fi
            done
            if ! cmp -s "artifacts/$platform.onnx" "previous/$platform.onnx"; then
              onnx_match=false
            fi
          done
          for archive in linux macos windows onnxruntime; do
            case "$archive" in
              macos) platform=darwin ;;
              windows) platform=win32 ;;
              *) platform=$archive ;;
            esac
            reusable=false
            if [ "$archive" = onnxruntime ]; then
              reusable=$onnx_match
            elif [ -s "previous/$platform.normalized" ] && [ -s "artifacts/$platform.normalized" ] &&
                 cmp -s "previous/$platform.normalized" "artifacts/$platform.normalized"; then
              reusable=true
            fi
            asset=$(grep -E "_third-party-source-${archive}\.tar\.gz$" previous/assets | sed -n '1p' || true)
            if [ "$reusable" = true ] && [ -n "$asset" ] &&
               gh release download "$previous" --pattern "$asset" --dir transfer; then
              test "$(gh release view "$SOURCE_TAG" --json isDraft --jq .isDraft)" = true
              gh release upload "$SOURCE_TAG" "transfer/$asset" --clobber
              rm -f "transfer/$asset"
              echo "- Copied \`$asset\` from \`$previous\` to \`$SOURCE_TAG\`." >> "$GITHUB_STEP_SUMMARY"
            else
              if [ -n "$asset" ]; then rm -f "transfer/$asset"; fi
              {
                echo "- Collect the $archive archive by hand (build-info differs or is missing, or no archive is available)."
                if [ "$archive" != onnxruntime ]; then
                  echo '```diff'
                  diff -u "previous/$platform.normalized" "artifacts/$platform.normalized" || true
                  echo '```'
                fi
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
