name: Checks

# Lint, types, both builds, Rust tests, dependency audits and the check without AVX2 on Linux for every
# non-draft pull request and push to main. Public-repository runners are free. scripts/check.sh adds
# the full tests with media and models and the UI flows locally before a release.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable
      # rust-cache leaves the root Cargo.toml out of its key. Without its hash here, a change of the build profiles
      # kept restoring a build cargo threw away, so every run compiled all dependencies again and saved nothing. Its
      # version line stays out: with it, the first runs after a new version started from an empty cache.
      - name: Build profiles
        id: profiles
        run: echo "hash=$(grep -v '^version = ' Cargo.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Only main saves; pull requests read main's cache and never push it out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: checks-ffmpeg-v1-${{ steps.profiles.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux dependencies
        run: bash scripts/setup-ubuntu-deps.sh
      - name: Install QEMU
        run: sudo apt-get install -y qemu-user-static
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Rust advisories and licences
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$HOME/.cargo/bin" --strip-components=1
          cargo deny --locked check advisories licenses
      - run: npm run lint
      - run: node --test 'scripts/*.test.mjs'
      - run: npm run build
      - run: npm run site:build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: ONNX Runtime
        run: node scripts/fetch-onnxruntime.mjs
      - run: cargo test --workspace --locked --no-fail-fast
      # The same files and checksums as scripts/fixtures.sh, only what the check without AVX2 needs.
      - name: Face models and stills
        run: |
          models=tmp-test/xdg/data/nuzky/models
          mkdir -p "$models"
          while read -r file sha url; do
            curl --fail --location --silent --show-error --output "$models/$file" "$url"
            echo "$sha  $models/$file" | sha256sum --check
          done <<'MODELS'
          yunet-2026may.onnx ebafce4e3c118d6554634be5c27ab333b4c047a9a8c3faf1d7cf93101c22f0f0 https://media.githubusercontent.com/media/opencv/opencv_zoo/26cc381e4d2594bb9f47a26eb8fd96c94a13660d/models/face_detection_yunet/face_detection_yunet_2026may.onnx
          face-landmarks-v2.onnx 6fc4bae7e3e2c5c0870e8d1b764839c7dcefee7e96c874b454da8be514e19f47 https://raw.githubusercontent.com/tomasmach/nuzky-models/a4f7e3c99e0b1b971d69595a1c3efb64fbc18730/face-landmarks-v2.onnx
          face-blendshapes-v2.onnx 74029fcef4076695dd1129d9c45a3d766532745868bd1eb3cc1deff87e7d6d66 https://raw.githubusercontent.com/tomasmach/nuzky-models/a4f7e3c99e0b1b971d69595a1c3efb64fbc18730/face-blendshapes-v2.onnx
          MODELS
          curl --fail --location --silent --show-error --range 0-10485759 --max-filesize 10485760 \
            --output tmp-test/.epps-2019-10-04.mp4 \
            https://images-assets.nasa.gov/video/iss061m2627771232_Live_Interviews_Jeanette_Epps_191004/iss061m2627771232_Live_Interviews_Jeanette_Epps_191004~large.mp4
          echo "0ceeb3bc5a834bbbc470b876ef959cf364da57d36a34b2b288704914202af105  tmp-test/.epps-2019-10-04.mp4" | sha256sum --check
          ffmpeg -v error -y -ss 8.984 -i tmp-test/.epps-2019-10-04.mp4 -frames:v 1 \
            -vf 'crop=396:704:447:8,scale=1080:1920:flags=lanczos,format=rgb24' tmp-test/face-open.png
          ffmpeg -v error -y -ss 9.151 -i tmp-test/.epps-2019-10-04.mp4 -frames:v 1 \
            -vf 'crop=396:704:447:8,scale=1080:1920:flags=lanczos,format=rgb24' tmp-test/face-blink.png
      # ONNX Runtime is opened at run time, never linked, so Nuzky starts on CPUs without AVX2.
      - name: Starts and finds faces without AVX2
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/tmp-test/xdg/data
          XDG_CACHE_HOME: ${{ github.workspace }}/tmp-test/xdg/cache
          XDG_RUNTIME_DIR: ${{ runner.temp }}/nuzky-runtime
        run: |
          ulimit -c 0
          mkdir -p "$XDG_RUNTIME_DIR"
          cargo build --locked --workspace --all-targets
          for program in nuzky-app nuzky; do
            said=$(qemu-x86_64-static -cpu Nehalem "target/debug/$program" mcp 2>&1) || true
            [[ $said == *INVALID_ARGUMENTS* ]] || { echo "$program does not start on a CPU without AVX2: $said" >&2; exit 1; }
          done
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="qemu-x86_64-static -cpu Nehalem" \
            cargo test --locked --workspace --lib -- --include-ignored runtime:: the_face_models
