name: Check the update notice

# Installed copies learn about a release from latest.json on the latest published release. This
# fails, and GitHub emails the owner, when they cannot read it: the repository is private, the file
# is missing, or "latest" is another release.
on:
  release:
    types: [published]

permissions: {}

jobs:
  latest-json:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read latest.json as an installed copy does
        env:
          TAG: ${{ github.event.release.tag_name }}
          URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          for attempt in 1 2 3 4 5; do
            manifest=$(curl -fsSL --proto '=https' --max-filesize 65536 "$URL") || manifest=
            version=$(jq -r .version <<< "$manifest") || version=
            if [ "v$version" = "$TAG" ] && urls=$(jq -er '
              [.platforms["darwin-aarch64-app", "darwin-aarch64", "windows-x86_64-nsis", "windows-x86_64", "linux-x86_64-appimage", "linux-x86_64-deb"]] |
              if all(.[]; (.url | type == "string" and length > 0) and (.signature | type == "string" and length > 0))
              then .[].url else error("Missing update URL or signature") end' <<< "$manifest"); then
              reachable=true
              while IFS= read -r url; do
                curl -fsIL --proto '=https' "$url" || reachable=false
              done <<< "$urls"
              if $reachable; then echo "Installed copies see $TAG."; exit 0; fi
            fi
            sleep 30
          done
          echo "::error::Installed copies cannot see $TAG: $URL gave '${version:-nothing}'. Is the repository public?"
          exit 1
