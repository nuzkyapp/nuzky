name: Bug report
description: Report a problem with Nuzky.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This report is public. Never attach a private video or a project you do not want public. A short clip recorded for this report that shows the problem is fine.

        Report security problems privately as [SECURITY.md](https://github.com/nuzkyapp/nuzky/blob/main/SECURITY.md) describes, using [Report a security problem](https://github.com/nuzkyapp/nuzky/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: Nuzky version
      description: Find it at the bottom of the home screen's sidebar.
      placeholder: 0.1.1-alpha
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and version
      placeholder: macOS 15.3, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you know them. The report Nuzky saved lists your last actions.
      placeholder: |
        1. Open Nuzky and...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Clip details
      description: For a problem with a clip, tell us the phone, the app it was recorded in, and the file type if known.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Report a bug… in Nuzky's Send feedback menu filled in a summary here and saved the whole report as a
        nuzky-report-….txt file in Nuzky's logs folder. Drag that file into this form. It holds the version, system,
        graphics, the format of the project's files, your last actions and the end of Nuzky's log, without folders,
        typed text or secrets; the log names files it had trouble with. Read it before sending.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed anything private from this report and attached no private video.
          required: true
