<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060607" />
    <title>Nuzky</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="top">
        <button id="projects" class="round bare" type="button" aria-label="Projects" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></svg>
        </button>
        <button id="title" class="title" type="button" aria-haspopup="dialog">
          <span class="namebtn">
            <span id="name" class="name">Nuzky</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </span>
          <span id="conn" class="conn"><i class="dot"></i><span>Connecting…</span></span>
        </button>
        <button id="export" class="pill prominent" type="button" aria-disabled="true">Export</button>
      </header>

      <main class="work">
        <section class="stage" aria-label="Preview">
          <img id="frame" alt="" hidden />
          <button id="add-first" class="pill prominent big" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
            Add videos
          </button>
        </section>
        <div class="transport">
          <span class="time"><b id="time-now">0:00.0</b> / <span id="time-total">0:00.0</span></span>
          <button id="undo" class="round bare" type="button" aria-label="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          </button>
          <button id="redo" class="round bare" type="button" aria-label="Redo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
          </button>
          <button id="play" class="round" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="fill play-icon"><path d="M7 4v16l13-8z" /></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="fill pause-icon"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
          </button>
        </div>
        <div id="tl" class="tl" role="slider" tabindex="0" aria-label="Playhead" aria-valuemin="0" aria-valuenow="0" hidden>
          <div id="tl-scroll" class="tl-scroll">
            <div class="ruler"><div id="ticks" class="ticks"></div></div>
            <div id="tl-body" class="tl-body">
              <div id="heads" class="heads"></div>
              <div id="lanes" class="lanes"><div id="tracks" class="tracks"></div></div>
            </div>
          </div>
          <div id="ph" class="ph"></div>
        </div>
        <div id="clipbar" class="clipbar" hidden>
          <div class="clip-head">
            <span id="clip-name" class="time"></span>
            <button id="clip-done" class="pill" type="button">Done</button>
          </div>
          <div class="acts">
            <button class="act" type="button" data-act="split">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3" /><path d="M8.12 8.12 12 12M20 4 8.12 15.88" /><circle cx="6" cy="18" r="3" /><path d="M14.8 14.8 20 20" /></svg>
              Split
            </button>
            <button class="act" type="button" data-act="duplicate">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg>
              Duplicate
            </button>
            <button class="act" type="button" data-act="detachAudio">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v3M6 6v11M10 3v18M14 8v7M18 5v13M22 10v3" /></svg>
              Detach audio
            </button>
            <button class="act danger" type="button" data-act="delete">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></svg>
              Delete
            </button>
          </div>
        </div>
      </main>

      <aside id="chat" class="chat" aria-label="AI">
        <div class="chat-head">
          <button class="agentchip" type="button" aria-haspopup="dialog"></button>
          <span class="grow"></span>
          <button id="past" class="round bare" type="button" aria-label="Past chats">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z" /><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1" /></svg>
          </button>
          <button id="new-chat" class="round bare" type="button" aria-label="New chat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.4 2.6a1 1 0 0 1 3 3l-9 9a2 2 0 0 1-.85.5l-2.87.84a.5.5 0 0 1-.62-.62l.84-2.87a2 2 0 0 1 .5-.85z" /></svg>
          </button>
          <button id="chat-close" class="round bare" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <div id="items" class="items" aria-live="polite"></div>
      </aside>

      <div id="dock" class="dock">
        <div id="lock" class="lock" hidden>
          <button id="lock-open" class="lock-open" type="button">
            <span class="spin" aria-hidden="true"></span>
            <span id="lock-text" class="lock-text">AI is editing</span>
            <span id="lock-step" class="lock-step"></span>
          </button>
          <button id="stop" class="pill" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
            Stop
          </button>
        </div>
        <div id="ai-row" class="ai-row">
          <button class="agentchip" type="button" aria-haspopup="dialog"></button>
          <button id="last" class="last" type="button">
            <span id="last-text"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
          </button>
        </div>
        <div class="upload-row">
          <button id="upload" class="last" type="button" hidden><span id="upload-text"></span></button>
          <button id="upload-drop" class="round bare" type="button" aria-label="Don't send it" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>
        <p id="note" class="note" hidden></p>
        <div class="composer">
          <button id="add" class="round" type="button" aria-label="Add videos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>
          </button>
          <textarea id="text" rows="1" enterkeyhint="send" placeholder="Tell the AI how to cut it…" aria-label="Message to the AI"></textarea>
          <button id="send" class="round send" type="button" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 19V5" /></svg>
          </button>
        </div>
      </div>
      <input id="files" type="file" accept="video/*,image/*,audio/*" multiple hidden />
    </div>

    <div id="scrim" class="scrim" hidden></div>
    <div id="agents" class="sheet" role="dialog" aria-label="AI agent" hidden></div>
    <div id="projects-sheet" class="sheet" role="dialog" aria-label="Projects" hidden></div>

    <div id="sheet" class="sheet" role="dialog" aria-labelledby="sheet-title" hidden>
      <div class="sheet-head">
        <h2 id="sheet-title">Exporting</h2>
        <button id="sheet-close" class="round bare" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <div id="sheet-progress" class="progress"><i></i></div>
      <p id="sheet-error" class="error" hidden></p>
      <div id="sheet-done" class="done" hidden>
        <video id="video" controls playsinline preload="none" hidden></video>
        <div class="file">
          <img id="sheet-thumb" alt="" />
          <div>
            <div id="sheet-name" class="file-name"></div>
            <div id="sheet-info" class="muted"></div>
          </div>
        </div>
        <div class="actions">
          <button id="play-export" class="pill" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="fill"><path d="M7 4v16l13-8z" /></svg>
            Play
          </button>
          <a id="save" class="pill prominent grow" href="/video?download=1" download>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 20h14" /></svg>
            <span id="save-text">Save to phone</span>
          </a>
        </div>
        <button id="export-again" class="pill" type="button">Export again</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
