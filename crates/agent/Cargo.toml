[package]
name = "nuzky-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs the user's own Claude Code or Codex, or ChatGPT on the user's plan, for one turn of Nuzky's AI panel"

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
dunce = "1.0.5"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = "3.4.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# The job that ends a probed CLI with what it started. Already in the build through wry and tokio.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
toml = "1.1"
