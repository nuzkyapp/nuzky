[package]
name = "nuzky-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dirs = "6"
dunce = "1.0.5"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
# The one ffmpeg-next uses, named here so build.rs learns which FFmpeg the headers are from.
ffmpeg-sys-next = { version = "9.0.0", default-features = false }
wgpu = "30.0.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19.0"
# The script type of cosmic-text's font fallback.
unicode-script = "0.5.8"
memmap2 = "0.9"
# RNNoise in Rust (BSD-3-Clause) for Clean voice; the default features only add its command-line tool.
nnnoiseless = { version = "0.5.2", default-features = false }
# Real FFT (MIT OR Apache-2.0) for Reduce echo; nnnoiseless already builds it.
realfft = "3.5.0"
uuid = { version = "1", features = ["v4", "serde"] }
png = "0.18.1"
# The WGSL front end wgpu builds already, to check plugin effects before any GPU sees them.
naga = { version = "30.0.1", features = ["wgsl-in"] }

[features]
schema = ["dep:schemars"]
# TypeScript declarations for src/lib/types.ts, generated by a test in src-tauri.
ts = ["dep:ts-rs"]

[dependencies.schemars]
workspace = true
optional = true

[dependencies.ts-rs]
workspace = true
optional = true
