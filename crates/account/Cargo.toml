[package]
name = "nuzky-account"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The optional Nuzky account, signed in to through the system browser"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
nuzky-oauth.workspace = true
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4"] }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript declarations for src/lib/types.ts, generated by a test in src-tauri.
ts = ["dep:ts-rs"]
