[package]
name = "nuzky-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nuzky-engine = { workspace = true, features = ["schema"] }
nuzky-session.workspace = true
nuzky-analysis.workspace = true
nuzky-vision.workspace = true
nuzky-interchange.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "sync"] }
base64 = "0.23.1"
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }
roxmltree = "0.21.1"
ruzstd = "0.9.1"
log = "0.4"
ureq = "3.4.2"
sha2 = "0.11.0"
dirs = "6"
dunce = "1.0.5"
imagesize = "0.15.0"
percent-encoding = "2.3.2"
url = "2.5.8"
libc = "0.2.190"
ts-rs = { workspace = true, optional = true }
rquickjs = "0.14.0"

[features]
# TypeScript declarations for src/lib/types.ts, generated by a test in src-tauri.
ts = ["dep:ts-rs"]

[target.'cfg(windows)'.dependencies]
getrandom = "0.4.3"
uds_windows = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
